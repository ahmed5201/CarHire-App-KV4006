<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Hire App - Main Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
        }
        .header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 {
            margin: 0;
            color: #f9ca24;
            font-size: 1.8rem;
        }
        .header nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease-in-out;
        }
        .header nav a:hover {
            color: #f9ca24;
        }
        .intro {
            text-align: center;
            margin: 60px 20px;
        }
        .intro h2 {
            font-size: 2.5rem;
        }
        .intro p {
            font-size: 1.2rem;
            margin: 20px 0;
        }
        .cta-button {
            background-color: #f9ca24;
            color: #1e3c72;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }
        .cta-button:hover {
            background-color: #f6b009;
            transform: scale(1.1);
        }
        .footer {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: #ddd;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>EasyCar Hire</h1>
        <nav>
            <a href="/">Home</a>
            <a href="login">Login</a>
            <a href="signup">Sign Up</a>
            <a href="car_rentals">Car Rentals</a>
            <a href="search">Search</a>
            <a href="suggestions">Suggestions</a>
            <a href="vehicledetails">Vehicle Details</a>
        </nav>
    </header>
    <main>
        <section class="intro">
            <h2>Drive Your Dreams</h2>
            <p>Discover a wide range of cars for hire at affordable prices. Perfect for every journey.</p>
            <button class="cta-button" onclick="window.location.href='car_rentals'">Explore Cars</button>
        </section>
    </main>
    <footer class="footer">
        <p>© 2025 EasyCar Hire | Crafted for seamless travel.</p>
    </footer>
</body>
</html>
